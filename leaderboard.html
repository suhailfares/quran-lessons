<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة المتصدرين - حفظ القرآن الكريم</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      color: #2d3748;
      margin-bottom: 1.5rem;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .search-bar input {
      padding: 0.6rem 1rem;
      font-size: 1rem;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      width: 280px;
      direction: rtl;
    }

    .search-bar button {
      padding: 0.6rem 1.4rem;
      font-size: 1rem;
      background: #3182ce;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-bar button:hover { background: #2b6cb0; }
    .search-bar button:disabled { background: #a0aec0; cursor: not-allowed; }

    #status {
      text-align: center;
      color: #718096;
      margin-bottom: 1rem;
      min-height: 1.4rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      overflow: hidden;
      max-width: 820px;
      margin: 0 auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #2d3748;
      color: #fff;
    }

    thead th {
      padding: 0.9rem 1.2rem;
      text-align: right;
      font-weight: 600;
      font-size: 0.95rem;
    }

    tbody tr:nth-child(even) { background: #f7fafc; }

    tbody tr:hover { background: #ebf4ff; }

    tbody td {
      padding: 0.8rem 1.2rem;
      font-size: 0.95rem;
      border-bottom: 1px solid #e2e8f0;
    }

    .rank {
      font-weight: 700;
      color: #2b6cb0;
      text-align: center;
    }

    .pages {
      font-weight: 700;
      color: #276749;
    }

    .medal-1 { color: #d4a017; }
    .medal-2 { color: #9e9e9e; }
    .medal-3 { color: #b45309; }

    #empty {
      text-align: center;
      padding: 3rem;
      color: #a0aec0;
      display: none;
    }
  </style>
</head>
<body>

<h1>🕌 لوحة المتصدرين — حفظ القرآن الكريم</h1>

<div class="search-bar">
  <input id="mosqueInput" type="text" placeholder="اسم المسجد" />
  <input id="fromDate" type="date" title="من تاريخ" />
  <input id="toDate"   type="date" title="إلى تاريخ" />
  <button id="fetchBtn" onclick="loadLeaderboard()">عرض</button>
</div>

<p id="status"></p>

<div class="card" id="tableWrapper" style="display:none">
  <table>
    <thead>
      <tr>
        <th style="text-align:center; width:60px">#</th>
        <th>اسم الطالب</th>
        <th>المعلم</th>
        <th style="text-align:center">الصفحات المحفوظة</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <p id="empty">لا توجد بيانات لهذا المسجد.</p>
</div>

<script>
  // ← Change this to your deployed API base URL
  const API_BASE = "http://192.168.1.5:8000";

  async function loadLeaderboard() {
    const mosque = document.getElementById("mosqueInput").value.trim();
    if (!mosque) {
      setStatus("الرجاء إدخال اسم المسجد.");
      return;
    }

    const btn = document.getElementById("fetchBtn");
    btn.disabled = true;
    setStatus("جارٍ التحميل…");

    try {
      const from = document.getElementById("fromDate").value;
      const to   = document.getElementById("toDate").value;

      let url = `${API_BASE}/api/quran/leaderboard/?mosque=${encodeURIComponent(mosque)}`;
      if (from) url += `&from=${from}`;
      if (to)   url += `&to=${to}`;

      const res = await fetch(url);

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        setStatus(`خطأ: ${err.detail || res.statusText}`);
        return;
      }

      const data = await res.json();
      renderTable(data, mosque);
    } catch (e) {
      setStatus("تعذّر الاتصال بالخادم. تحقق من عنوان API.");
    } finally {
      btn.disabled = false;
    }
  }

  function renderTable(data, mosque) {
    const wrapper = document.getElementById("tableWrapper");
    const tbody   = document.getElementById("tbody");
    const empty   = document.getElementById("empty");

    wrapper.style.display = "block";
    tbody.innerHTML = "";

    if (data.length === 0) {
      empty.style.display = "block";
      setStatus("");
      return;
    }

    empty.style.display = "none";
    const from = document.getElementById("fromDate").value;
    const to   = document.getElementById("toDate").value;
    const range = (from || to)
      ? ` · ${from || "…"} → ${to || "…"}`
      : "";
    setStatus(`${data.length} طالب في مسجد "${mosque}"${range}`);

    const medals = ["🥇", "🥈", "🥉"];

    data.forEach((row, i) => {
      const rank = i + 1;
      const medal = medals[i] ?? rank;
      const medalClass = i < 3 ? `medal-${rank}` : "";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="rank ${medalClass}">${medal}</td>
        <td>${escHtml(row.student_name)}</td>
        <td>${escHtml(row.teacher_name)}</td>
        <td class="pages" style="text-align:center">${row.pages}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function setStatus(msg) {
    document.getElementById("status").textContent = msg;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // Allow pressing Enter in the input
  document.getElementById("mosqueInput")
    .addEventListener("keydown", e => { if (e.key === "Enter") loadLeaderboard(); });
</script>

</body>
</html>
