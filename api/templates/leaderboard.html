<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة المتصدرين - حفظ القرآن الكريم</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .login-card h1 { text-align: center; font-size: 1.5rem; color: #2d3748; margin-bottom: 0.4rem; }
    .login-subtitle { text-align: center; color: #718096; font-size: 0.9rem; margin-bottom: 2rem; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #4a5568; margin-bottom: 0.35rem; }
    .form-group input {
      width: 100%; padding: 0.65rem 0.9rem; font-size: 1rem;
      border: 1px solid #cbd5e0; border-radius: 8px; outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: #3182ce; }

    .btn-primary {
      width: 100%; padding: 0.75rem; background: #3182ce; color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
      margin-top: 0.5rem; transition: background 0.2s;
    }
    .btn-primary:hover  { background: #2b6cb0; }
    .btn-primary:disabled { background: #a0aec0; cursor: not-allowed; }

    #loginError { color: #e53e3e; font-size: 0.85rem; text-align: center; margin-top: 0.75rem; min-height: 1.2rem; }

    /* ── LEADERBOARD ── */
    #leaderboardScreen { display: none; padding: 1.5rem 1rem; }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 900px; margin: 0 auto 1.25rem; flex-wrap: wrap; gap: 0.5rem;
    }
    .top-bar h1 { font-size: 1.4rem; color: #2d3748; }

    .top-bar-right { display: flex; align-items: center; gap: 0.75rem; }
    #usernameDisplay { color: #4a5568; font-size: 0.9rem; }

    .btn-logout {
      padding: 0.4rem 0.9rem; background: transparent;
      border: 1px solid #cbd5e0; border-radius: 6px; cursor: pointer;
      font-size: 0.85rem; color: #718096; transition: all 0.2s;
    }
    .btn-logout:hover { background: #fed7d7; border-color: #fc8181; color: #c53030; }

    .controls {
      display: flex; justify-content: center; gap: 0.75rem;
      max-width: 900px; margin: 0 auto 1.25rem; flex-wrap: wrap; align-items: flex-end;
    }

    .ctrl-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .ctrl-group label { font-size: 0.8rem; font-weight: 600; color: #4a5568; }

    .controls select,
    .controls input[type="date"] {
      padding: 0.55rem 0.9rem; font-size: 0.9rem;
      border: 1px solid #cbd5e0; border-radius: 8px;
      background: #fff; outline: none;
    }
    .controls select { min-width: 180px; }

    .btn-show {
      padding: 0.55rem 1.4rem; background: #3182ce; color: #fff;
      border: none; border-radius: 8px; font-size: 0.9rem; cursor: pointer;
      align-self: flex-end; transition: background 0.2s;
    }
    .btn-show:hover    { background: #2b6cb0; }
    .btn-show:disabled { background: #a0aec0; cursor: not-allowed; }

    #status {
      text-align: center; color: #718096; font-size: 0.85rem;
      min-height: 1.2rem; max-width: 900px; margin: 0 auto 0.75rem;
    }

    .card {
      background: #fff; border-radius: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      overflow: hidden; max-width: 900px; margin: 0 auto;
    }

    table { width: 100%; border-collapse: collapse; }
    thead { background: #2d3748; color: #fff; }
    thead th { padding: 0.85rem 1.2rem; text-align: right; font-weight: 600; font-size: 0.9rem; }
    tbody tr:nth-child(even) { background: #f7fafc; }
    tbody tr:hover { background: #ebf4ff; }
    tbody td { padding: 0.75rem 1.2rem; font-size: 0.9rem; border-bottom: 1px solid #e2e8f0; }

    .rank  { font-weight: 700; color: #2b6cb0; text-align: center; }
    .pages { font-weight: 700; color: #276749; text-align: center; }
    .medal-1 { color: #d4a017; }
    .medal-2 { color: #9e9e9e; }
    .medal-3 { color: #b45309; }

    #empty { text-align: center; padding: 3rem; color: #a0aec0; display: none; }

    .countdown { text-align: center; color: #a0aec0; font-size: 0.8rem; margin-top: 0.75rem; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <h1>🕌 لوحة المتصدرين</h1>
    <p class="login-subtitle">حفظ القرآن الكريم</p>
    <div class="form-group">
      <label for="lusername">اسم المستخدم</label>
      <input id="lusername" type="text" autocomplete="username" />
    </div>
    <div class="form-group">
      <label for="lpassword">كلمة المرور</label>
      <input id="lpassword" type="password" autocomplete="current-password" />
    </div>
    <button class="btn-primary" id="loginBtn" onclick="doLogin()">تسجيل الدخول</button>
    <p id="loginError"></p>
  </div>
</div>

<!-- LEADERBOARD -->
<div id="leaderboardScreen">
  <div class="top-bar">
    <h1>🕌 لوحة المتصدرين — حفظ القرآن الكريم</h1>
    <div class="top-bar-right">
      <span id="usernameDisplay"></span>
      <button class="btn-logout" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <div class="controls">
    <div class="ctrl-group">
      <label>المسجد</label>
      <select id="mosqueSelect"></select>
    </div>
    <div class="ctrl-group">
      <label>من</label>
      <input id="fromDate" type="date" />
    </div>
    <div class="ctrl-group">
      <label>إلى</label>
      <input id="toDate" type="date" />
    </div>
    <button class="btn-show" id="showBtn" onclick="loadLeaderboard()">عرض</button>
  </div>

  <p id="status"></p>

  <div class="card" id="tableWrapper" style="display:none">
    <table>
      <thead>
        <tr>
          <th style="text-align:center; width:60px">#</th>
          <th>اسم الطالب</th>
          <th>المعلم</th>
          <th style="text-align:center">الصفحات المحفوظة</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <p id="empty">لا توجد بيانات لهذا المسجد في الفترة المحددة.</p>
  </div>

  <p class="countdown" id="countdown"></p>
</div>

<script>
  const API_BASE = "";
  let _refreshTimer = null;
  let _countdownTimer = null;
  let _secondsLeft = 60;

  // ── helpers ──────────────────────────────────────────────────────────────

  const $  = id => document.getElementById(id);
  const tk = () => localStorage.getItem("tk");
  const ah = () => ({ "Authorization": `Bearer ${tk()}`, "Content-Type": "application/json" });

  function fmtDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${dd}`;
  }

  function lastSaturday() {
    const t = new Date();
    // getDay(): 0=Sun 1=Mon … 6=Sat  → days since last Saturday = (day+1)%7
    const back = (t.getDay() + 1) % 7;
    const s = new Date(t);
    s.setDate(t.getDate() - back);
    return s;
  }

  function esc(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function showLogin() {
    $("loginScreen").style.display = "flex";
    $("leaderboardScreen").style.display = "none";
  }

  function showBoard() {
    $("loginScreen").style.display = "none";
    $("leaderboardScreen").style.display = "block";
  }

  function setStatus(msg) { $("status").textContent = msg; }

  // ── login / logout ────────────────────────────────────────────────────────

  async function doLogin() {
    const username = $("lusername").value.trim();
    const password = $("lpassword").value;
    $("loginError").textContent = "";

    if (!username || !password) {
      $("loginError").textContent = "يرجى إدخال اسم المستخدم وكلمة المرور.";
      return;
    }

    $("loginBtn").disabled = true;
    $("loginBtn").textContent = "جارٍ الدخول…";

    try {
      const res = await fetch(`${API_BASE}/api/auth/login/`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        $("loginError").textContent = data.detail || "بيانات غير صحيحة.";
        return;
      }
      localStorage.setItem("tk", data.access);
      await initBoard();
    } catch {
      $("loginError").textContent = "تعذّر الاتصال بالخادم.";
    } finally {
      $("loginBtn").disabled = false;
      $("loginBtn").textContent = "تسجيل الدخول";
    }
  }

  function doLogout() {
    localStorage.removeItem("tk");
    stopTimers();
    $("lusername").value = "";
    $("lpassword").value = "";
    $("loginError").textContent = "";
    showLogin();
  }

  // ── init leaderboard ──────────────────────────────────────────────────────

  async function initBoard() {
    // user info
    const meRes = await fetch(`${API_BASE}/api/users/me/`, { headers: ah() });
    if (meRes.status === 401) { doLogout(); return; }
    const me = await meRes.json();
    $("usernameDisplay").textContent = `${me.first_name} ${me.last_name}`;

    // mosque list
    const mRes = await fetch(`${API_BASE}/api/mosques/`, { headers: ah() });
    if (mRes.status === 401) { doLogout(); return; }
    const mosques = await mRes.json();

    const sel = $("mosqueSelect");
    sel.innerHTML = "";
    mosques.forEach(m => {
      const o = document.createElement("option");
      o.value = o.textContent = m;
      sel.appendChild(o);
    });

    // default dates
    $("fromDate").value = fmtDate(lastSaturday());
    $("toDate").value   = fmtDate(new Date());

    showBoard();
    await loadLeaderboard();
    startTimers();
  }

  // ── leaderboard data ──────────────────────────────────────────────────────

  async function loadLeaderboard() {
    const mosque = $("mosqueSelect").value;
    const from   = $("fromDate").value;
    const to     = $("toDate").value;

    if (!mosque) { setStatus("يرجى اختيار المسجد."); return; }

    $("showBtn").disabled = true;
    setStatus("جارٍ التحميل…");

    try {
      let url = `${API_BASE}/api/quran/leaderboard/?mosque=${encodeURIComponent(mosque)}`;
      if (from) url += `&from=${from}`;
      if (to)   url += `&to=${to}`;

      const res = await fetch(url, { headers: ah() });
      if (res.status === 401) { doLogout(); return; }
      if (!res.ok) {
        const e = await res.json().catch(() => ({}));
        setStatus(`خطأ: ${e.detail || res.statusText}`);
        return;
      }
      renderTable(await res.json(), mosque, from, to);
    } catch {
      setStatus("تعذّر الاتصال بالخادم.");
    } finally {
      $("showBtn").disabled = false;
    }
  }

  function renderTable(data, mosque, from, to) {
    $("tableWrapper").style.display = "block";
    $("tbody").innerHTML = "";

    if (data.length === 0) {
      $("empty").style.display = "block";
      setStatus(`مسجد "${mosque}" — لا توجد بيانات في هذه الفترة`);
      return;
    }

    $("empty").style.display = "none";
    const range = (from || to) ? ` · ${from || "…"} ← ${to || "…"}` : "";
    const now = new Date().toLocaleTimeString("ar");
    setStatus(`${data.length} طالب · ${mosque}${range} · آخر تحديث ${now}`);

    const medals = ["🥇", "🥈", "🥉"];
    data.forEach((row, i) => {
      const medal = i < 3 ? medals[i] : i + 1;
      const cls   = i < 3 ? `medal-${i + 1}` : "";
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="rank ${cls}">${medal}</td>
        <td>${esc(row.student_name)}</td>
        <td>${esc(row.teacher_name)}</td>
        <td class="pages">${row.pages}</td>`;
      $("tbody").appendChild(tr);
    });
  }

  // ── auto-refresh ──────────────────────────────────────────────────────────

  function startTimers() {
    stopTimers();
    _secondsLeft = 60;

    _refreshTimer = setInterval(() => {
      _secondsLeft = 60;
      loadLeaderboard();
    }, 60_000);

    _countdownTimer = setInterval(() => {
      _secondsLeft--;
      $("countdown").textContent = `تحديث تلقائي خلال ${_secondsLeft} ثانية`;
    }, 1_000);
  }

  function stopTimers() {
    clearInterval(_refreshTimer);
    clearInterval(_countdownTimer);
    _refreshTimer = _countdownTimer = null;
    $("countdown").textContent = "";
  }

  // ── keyboard shortcuts ────────────────────────────────────────────────────

  $("lpassword").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  $("lusername").addEventListener("keydown", e => { if (e.key === "Enter") $("lpassword").focus(); });

  // ── bootstrap ─────────────────────────────────────────────────────────────

  (async () => {
    if (!tk()) { showLogin(); return; }
    try { await initBoard(); }
    catch { doLogout(); }
  })();
</script>

</body>
</html>
